apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: run_id
          matcherRegex: '"run_id":\s*"([0-9a-f]+)"'
          url: "${LANGFUSE_PUBLIC_URL}/project/reflexdesk/sessions/$${__value.raw}"
