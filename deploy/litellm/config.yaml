model_list:
  - model_name: tier1
    litellm_params:
      model: openai/qwen/qwen3.8-flash
      api_base: https://polza.ai/api/v1
      api_key: os.environ/QWEN_API_KEY
      timeout: 90
  - model_name: tier2
    litellm_params:
      model: deepseek/deepseek-flash
      api_base: https://api.deepseek.com
      api_key: os.environ/DEEPSEEK_API_KEY
      timeout: 30
  - model_name: tier3
    litellm_params:
      model: openai/qwen/qwen3.8-flash
      api_base: https://polza.ai/api/v1
      api_key: os.environ/QWEN_API_KEY
      timeout: 180

litellm_settings:
  drop_params: false
  num_retries: 0
  request_timeout: 180

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
