global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: app
    static_configs:
      - targets: ["app:8000"]
  - job_name: reflector
    static_configs:
      - targets: ["reflector:9101"]
  - job_name: evals
    static_configs:
      - targets: ["evals:9102"]
  - job_name: qdrant
    static_configs:
      - targets: ["qdrant:6333"]
  - job_name: gpu
    static_configs:
      - targets: ["gpu_exporter:9835"]
