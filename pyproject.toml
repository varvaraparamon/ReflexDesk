[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflexdesk"
version = "0.1.0"
description = "Multi-agent investment research desk with reflection"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langmem>=0.0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "qdrant-client>=1.10",
    "fastembed>=0.4",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "feedparser>=6.0",
    "pandas_market_calendars>=4.4",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "langfuse>=3.15,<4",
    "aiogram>=3.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
reflexdesk = "reflexdesk.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reflexdesk = ["router/config.yaml", "evals/golden/cases.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that call external APIs (DeepSeek, Yahoo, SEC)",
    "docker: tests that require the docker sandbox",
]
addopts = "-m 'not live and not docker'"
